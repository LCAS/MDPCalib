services:
  vnc:
    image: lcas.lincoln.ac.uk/vnc
    volumes:
      - x11:/tmp/.X11-unix
    networks:
      - mdpcalib_net
    ports:
      - "5801:5801"
    stdin_open: true
    tty: true
    ipc: shareable

  bag-player:
    build:
      context: ./bag-player
    image: ghcr.io/lcas/mdpcalib-bag-player:latest
    volumes:
      # your data volume (set DATA_PATH in your .env file); the rosbag2 folder
      # is expected at $DATA_PATH/bag (override with BAG_PATH).
      - ${DATA_PATH:-./data}:/data
    environment:
      - BAG_PATH=${BAG_PATH:-/data/bag}
      - BAG_LOOP=${BAG_LOOP:-false}
      - BAG_RATE=${BAG_RATE:-1.0}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    networks:
      - mdpcalib_net
    depends_on:
      - vnc

  mdpcalib:
    build:
      context: .
    image: ghcr.io/lcas/mdpcalib:latest
    volumes:
      # your data volume (set DATA_PATH in your .env file)
      - ${DATA_PATH:-./data}:/data

      # X11 socket shared with the VNC service
      - x11:/tmp/.X11-unix

    environment:
      - DISPLAY=:1.0
      - NVIDIA_DRIVER_CAPABILITIES=all

      # ROS 2 sensor topics — override in your .env file as needed
      - ROS2_CAMERA_IMAGE_TOPIC=${ROS2_CAMERA_IMAGE_TOPIC:-/camera/image_raw}
      - ROS2_CAMERA_INFO_TOPIC=${ROS2_CAMERA_INFO_TOPIC:-/camera/camera_info}
      - ROS2_LIDAR_POINTS_TOPIC=${ROS2_LIDAR_POINTS_TOPIC:-/points_raw}
      - ROS2_IMU_TOPIC=${ROS2_IMU_TOPIC:-/imu/data}
      - LIDAR_FRAME_ID=${LIDAR_FRAME_ID:-lidar}
      - CAMERA_FRAME_ID=${CAMERA_FRAME_ID:-camera}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]

    networks:
      - mdpcalib_net

    depends_on:
      - vnc
      - bag-player

    ipc: "service:vnc"

    command: bash /root/catkin_ws/src/mdpcalib/pose_synchronizer/scripts/start_ros2_calibration.sh

    tty: true
    stdin_open: true

volumes:
  x11:

networks:
  mdpcalib_net:
