services:
  mdpcalib:
    image: ${MDPCALIB_IMAGE:-ghcr.io/lcas/mdpcalib:latest}
    volumes:
      # your data volume (set DATA_PATH in your .env file)
      - ${DATA_PATH:-./data}:/data

      # required x-forwarding
      - /tmp/.X11-unix:/tmp/.X11-unix

    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=${XAUTHORITY:-}
      - NVIDIA_DRIVER_CAPABILITIES=all

    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [ gpu ]

    network_mode: host

    tty: true
    stdin_open: true
